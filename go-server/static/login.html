<html>
<head runat="server">
	<title>OmniDB</title>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link rel="shortcut icon" type="image/x-icon" href="{{url_folder}}/static/OmniDB_app/images/favicon.ico" />

	<link rel="stylesheet" href="{{url_folder}}/static/OmniDB_app/lib/bootstrap/bootstrap.min.css?v{{static_cache_bust}}">
	<link rel="stylesheet" href="{{url_folder}}/static/OmniDB_app/css/omnidb.min.css?v{{static_cache_bust}}">
	<link rel="stylesheet" href="{{url_folder}}/static/OmniDB_app/css/login.min.css?v{{static_cache_bust}}">
	<link rel="stylesheet" href="{{url_folder}}/static/OmniDB_app/css/user_select_guard.css?v{{static_cache_bust}}">
	<style>
		/* Native OS Appearance & Arrow Fix */
		.form-control, select, input, textarea {
			appearance: auto !important;
			-webkit-appearance: auto !important;
			background-image: none !important;
		}
	</style>
</head>
<body class="omnidb--theme-light">

	<div class="omnidb__login" autofill="false">
		<div class="omnidb__login__wrapper">
			<div class="omnidb__login__logo">
				{{svg_logo}}
				<div class="omnidb__login__version">
					<small>v{{omnidb_short_version}}</small>
				</div>
			</div>

			<div class="loginWrap-body">
				<div class="omnidb__login__input-wrapper">
					<label id="user_title">user</label>
					<input id="txt_user" type="text" placeholder="user">
				</div>
				<div class="omnidb__login__input-wrapper">
					<label id="pwd_title">pwd</label>
					<input id="txt_pwd" type="password" placeholder="password">
				</div>
				<button id="bt_sign_in" type="button">Sign in</button>
			</div>
		</div>
	</div>



<!-- Modal Generic Message -->
<div class="modal fade" id="modal_message" tabindex="-1" role="dialog" aria-hidden="true">
	<div id="modal_message_dialog" class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div id="modal_message_content" class="modal-body" style='white-space: pre-line;'>
			</div>
			<div class="modal-footer">
				<button id="modal_message_yes" type="button" class="btn omnidb__theme__btn--primary" data-bs-dismiss="modal">Yes</button>
				<button id="modal_message_ok" type="button" class="btn omnidb__theme__btn--primary" data-bs-dismiss="modal">Ok</button>
				<button id="modal_message_no" type="button" class="btn btn-danger" data-bs-dismiss="modal">No</button>
				<button id="modal_message_cancel" type="button" class="btn omnidb__theme__btn--secondary" data-bs-dismiss="modal">Cancel</button>
			</div>
		</div>
	</div>
</div>

<div id="div_loading" class="div_loading" style='z-index: 100005;'>
	<div class="div_loading_cover"></div>
	<div class="div_loading_content">
		<div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status">
			<span class="sr-only ">Loading...</span>
		</div>
		<div>
			<button id="bt_cancel_ajax" style='display: none; margin-top: 10px;' class='btn btn-light'>Cancel</button>
		</div>
	</div>
</div>

<script type="text/javascript" src="{{url_folder}}/static/OmniDB_app/lib/jquery/jquery.min.js?v{{static_cache_bust}}"></script>
<script src="{{url_folder}}/static/OmniDB_app/lib/bootstrap/bootstrap.min.js?v{{static_cache_bust}}"></script>
<!-- The two server-rendered values the bundle reads off `window`. They have to
     be set *before* it loads: src/login_page.js calls checkSessionMessage() as
     it evaluates, and execAjax reads both. -->
<script type="text/javascript">
	var v_url_folder = '{{url_folder}}';
	var v_csrf_cookie_name = '{{csrf_cookie_name}}';
</script>
<!-- Vite bundle for this page (go-server/frontend/, src/login.js):
     notification_control + ajax_control + context_menu_guard, plus
     login_page.js, which holds what used to be an inline <script> here and
     binds the form. This page has no executable markup left. -->
<script type="text/javascript" src="{{url_folder}}/static/OmniDB_app/dist/omnidb.login.js?v{{static_cache_bust}}"></script>

</body>
</html>
