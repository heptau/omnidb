<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>OmniDB | Open Source Database Management Tool</title>

	<link rel="canonical" href="https://www.omnidb.net/" />
	<meta name="robots" content="index, follow">
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#192e4d">
	<link rel="apple-touch-icon" href="assets/omnidb-icon.png">

	<link rel="alternate" hreflang="x-default" href="https://www.omnidb.net/" />
	<link rel="alternate" hreflang="en" href="https://www.omnidb.net/en/" />

	<meta property="og:title" content="OmniDB - Lightweight Database Management" />
	<meta property="og:description" content="The open-source database tool revival. Lightweight, fast, and collaborative. Maintained by the PgArachne team." />
	<meta property="og:image" content="https://www.omnidb.net/assets/omnidb-logo.jpeg" />
	<meta property="og:url" content="https://www.omnidb.net/" />
	<meta property="og:type" content="website" />

	<meta http-equiv="refresh" content="2; url=en/" />

	<link rel="alternate" type="text/plain" title="llms.txt" href="llms.txt">
	<link rel="alternate" type="text/plain" title="llms-full.txt" href="llms-full.txt">

	<script>
		(function () {
			// Supported languages
			var supported = ['en'];

			// Get user's preferred languages
			var userLangs = navigator.languages || [navigator.language || navigator.userLanguage];
			var target = 'en/'; // Default fallback

			// Find the first matching language
			for (var i = 0; i < userLangs.length; i++) {
				if (!userLangs[i]) continue;
				var code = userLangs[i].substring(0, 2).toLowerCase();

				if (supported.indexOf(code) !== -1) {
					target = code + '/';
					break;
				}
			}

			// Redirect
			window.location.href = target;
		})();
	</script>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
			text-align: center;
			padding-top: 100px;
			color: #192e4d;
			background-color: #f4f7f9;
		}

		.loader {
			border: 4px solid #f3f3f3;
			border-top: 4px solid #192e4d;
			border-radius: 50%;
			width: 40px;
			height: 40px;
			animation: spin 1s linear infinite;
			margin: 20px auto;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}

		ul {
			list-style-type: none;
			padding: 0;
			margin-top: 30px;
		}

		li {
			display: inline;
			margin: 0 15px;
		}

		a {
			text-decoration: none;
			color: #8199bf;
			font-size: 1.1em;
			font-weight: 600;
			transition: color 0.2s;
		}

		a:hover {
			color: #192e4d;
		}
	</style>
</head>

<body>
	<div class="loader"></div>
	<p>Redirecting to OmniDB Project...</p>
	<p>If you are not redirected automatically, please choose a language:</p>
	<ul>
		<li><a href="en/">English</a></li>
	</ul>
</body>

</html>
