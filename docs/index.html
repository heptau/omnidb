<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>OmniDB | Open Source Database Management Tool</title>

	<link rel="canonical" href="https://www.omnidb.net/" />
	<meta name="robots" content="index, follow">
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#192e4d">
	<link rel="apple-touch-icon" href="assets/omnidb-icon.png">

	<link rel="alternate" hreflang="x-default" href="https://www.omnidb.net/" />
	<link rel="alternate" hreflang="en" href="https://www.omnidb.net/en/" />
	<link rel="alternate" hreflang="cs" href="https://www.omnidb.net/cs/" />
	<link rel="alternate" hreflang="de" href="https://www.omnidb.net/de/" />
	<link rel="alternate" hreflang="es" href="https://www.omnidb.net/es/" />
	<link rel="alternate" hreflang="fr" href="https://www.omnidb.net/fr/" />
	<link rel="alternate" hreflang="it" href="https://www.omnidb.net/it/" />
	<link rel="alternate" hreflang="pt" href="https://www.omnidb.net/pt/" />

	<meta property="og:title" content="OmniDB - Lightweight Database Management" />
	<meta property="og:description" content="The open-source database tool revival. Lightweight, fast, and collaborative. Maintained by the PgArachne team." />
	<meta property="og:image" content="https://www.omnidb.net/assets/omnidb-logo.jpeg" />
	<meta property="og:url" content="https://www.omnidb.net/" />
	<meta property="og:type" content="website" />

	<meta http-equiv="refresh" content="2; url=en/index.html" />

	<link rel="alternate" type="text/plain" title="llms.txt" href="llms.txt">
	<link rel="alternate" type="text/plain" title="llms-full.txt" href="llms-full.txt">

	<script>
		(function () {
			var STORAGE_KEY = 'omnidb_lang';
			var supported = ['en', 'cs', 'de', 'es', 'fr', 'it', 'pt'];
			var suffix = window.location.protocol === 'file:' ? '/index.html' : '/';

			// Returns one of the literal entries of `supported`, never the
			// (untrusted, DOM-storage-sourced) candidate itself — so nothing
			// but a hardcoded language code can ever reach the
			// window.location.href assignment below, no matter what's stored
			// under STORAGE_KEY or reported by the browser.
			function toSupportedLang(candidate) {
				var idx = supported.indexOf(candidate);
				return idx === -1 ? null : supported[idx];
			}

			var lang = null;

			// Check saved preference first
			try {
				lang = toSupportedLang(localStorage.getItem(STORAGE_KEY));
			} catch (e) { /* localStorage unavailable */ }

			if (!lang) {
				// Auto-detect from browser settings
				var userLangs = navigator.languages || [navigator.language || navigator.userLanguage];
				for (var i = 0; i < userLangs.length; i++) {
					if (!userLangs[i]) continue;
					lang = toSupportedLang(userLangs[i].substring(0, 2).toLowerCase());
					if (lang) break;
				}
				lang = lang || 'en'; // Default fallback

				// Save auto-detected preference
				try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* ignore */ }
			}

			window.location.href = lang + suffix;
		})();
	</script>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
			text-align: center;
			padding-top: 100px;
			color: #192e4d;
			background-color: #f4f7f9;
		}

		.loader {
			border: 4px solid #f3f3f3;
			border-top: 4px solid #192e4d;
			border-radius: 50%;
			width: 40px;
			height: 40px;
			animation: spin 1s linear infinite;
			margin: 20px auto;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}

		ul {
			list-style-type: none;
			padding: 0;
			margin-top: 30px;
		}

		li {
			display: inline;
			margin: 0 15px;
		}

		a {
			text-decoration: none;
			color: #8199bf;
			font-size: 1.1em;
			font-weight: 600;
			transition: color 0.2s;
		}

		a:hover {
			color: #192e4d;
		}
	</style>
</head>

<body>
	<div class="loader"></div>
	<p>Redirecting to OmniDB Project...</p>
	<p>If you are not redirected automatically, please choose a language:</p>
	<ul id="lang-fallback-links">
		<li><a href="en/">English</a></li>
		<li><a href="cs/">Čeština</a></li>
		<li><a href="de/">Deutsch</a></li>
		<li><a href="es/">Español</a></li>
		<li><a href="fr/">Français</a></li>
		<li><a href="it/">Italiano</a></li>
		<li><a href="pt/">Português</a></li>
	</ul>
	<script>
		// Fix fallback links for file:// protocol (needs explicit index.html)
		if (window.location.protocol === 'file:') {
			document.querySelectorAll('#lang-fallback-links a').forEach(function (a) {
				a.href = a.getAttribute('href') + 'index.html';
			});
		}
	</script>
</body>

</html>
