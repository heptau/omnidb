name: Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  go-server:
    name: go-server (build, vet, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        run: go build ./...
        working-directory: go-server

      - name: Vet
        run: go vet ./...
        working-directory: go-server

      - name: Test
        run: go test ./...
        working-directory: go-server

      - name: gofmt check
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [[ -n "$UNFORMATTED" ]]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
        working-directory: go-server

  wails-app:
    name: wails-app (build, vet)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Wails GTK/webkit2gtk dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: wails-app/frontend

      - name: Build
        run: go build ./...
        working-directory: wails-app

      - name: Vet
        run: go vet ./...
        working-directory: wails-app
