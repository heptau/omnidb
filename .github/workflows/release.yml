name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ── Create the GitHub release immediately so assets can trickle in ───────────
  prepare:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk "/^\#\# \[${VERSION}\]/{found=1; next} found && /^\#\# \[/{exit} found && NF{print}" CHANGELOG.md 2>/dev/null || true)
          if [[ -z "$NOTES" ]]; then NOTES="Release v${VERSION}"; fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "OmniDB v${{ steps.version.outputs.version }}" \
            --notes "${{ steps.notes.outputs.notes }}"

  # ── Build each platform natively, upload asset as soon as it's ready ─────────
  # The desktop shell is Wails (wails-app/) — the NW.js shell (deploy/app/)
  # has been removed entirely, no fallback. The macOS build has been verified
  # end-to-end against a real server; Linux and Windows have not run on real
  # hardware before this — treat their first few runs here as the actual test.
  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest,   label: macOS arm64,    make_target: build-mac-arm64 }
          - { runner: ubuntu-latest,  label: Linux x64,      make_target: build-linux     }
          - { runner: windows-latest, label: Windows x64,    make_target: build-win       }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
        shell: powershell

      - name: Install LDAP headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install Wails GTK/webkit2gtk dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Python dependencies
        shell: bash
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        shell: bash
        run: scripts/build_release.sh
        env:
          MAKE_TARGET: ${{ matrix.make_target }}

      - name: Upload asset to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(cat VERSION | tr -d '\r\n')"
          VERSION="${VERSION//$'\r'/}"
          for f in build/dist/OmniDB-*; do
            [[ -f "$f" ]] || continue
            [[ "$f" == *checksums* ]] && continue
            gh release upload "v${VERSION}" "$f"
          done

      - name: Upload artifact (for Homebrew step)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.make_target }}
          path: build/dist/
          retention-days: 1

  # ── After all builds: merge checksums, update Homebrew Cask ─────────────────
  homebrew:
    name: Update Homebrew Cask
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: build/dist-tmp/
          merge-multiple: false

      - name: Merge checksums
        run: |
          mkdir -p build/dist
          find build/dist-tmp/ -name 'checksums.txt' -exec cat {} \; \
            | sort -u -k2 > build/dist/checksums.txt
          find build/dist-tmp/ -not -name 'checksums.txt' -type f \
            -exec cp {} build/dist/ \;

      - name: Upload checksums to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(cat VERSION | tr -d '\r\n')"
          gh release upload "v${VERSION}" build/dist/checksums.txt

      - name: Generate Homebrew Cask
        run: scripts/gen_cask.sh

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAP_REPO="${HOMEBREW_TAP_REPO:-heptau/homebrew-tap}"
          TAP_CASK="${HOMEBREW_TAP_CASK:-Casks/omnidb.rb}"
          VERSION="$(cat VERSION | tr -d '\r\n')"

          CURRENT_SHA=$(gh api "repos/${TAP_REPO}/contents/${TAP_CASK}" \
            --jq '.sha' 2>/dev/null || true)
          CONTENT=$(base64 < build/dist/omnidb.rb | tr -d '\n')

          if [[ -n "$CURRENT_SHA" ]]; then
            gh api "repos/${TAP_REPO}/contents/${TAP_CASK}" \
              --method PUT \
              -f message="omnidb v${VERSION}" \
              -f content="${CONTENT}" \
              -f sha="${CURRENT_SHA}"
          else
            gh api "repos/${TAP_REPO}/contents/${TAP_CASK}" \
              --method PUT \
              -f message="omnidb v${VERSION}" \
              -f content="${CONTENT}"
          fi
          echo "Homebrew tap updated in ${TAP_REPO}."
