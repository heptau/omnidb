<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta content="width=device-width, initial-scale=1.0" name="viewport" />
	<title>OmniDB</title>
	<style type="text/css">
		html,
		body {
			margin: 0;
			padding: 0;
			border: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: #F2F2F2;
		}

		@media (prefers-color-scheme: dark) {
			body {
				background-color: #2F3136;
			}
		}

		/* main.js clears this element's inline `display:none` (it used to be
		   what revealed the branded splash) and keeps appending backend log
		   lines into #loading, e.g. "Opening OmniDB..." -- without this rule
		   that text would show up unstyled at the window's top-left the
		   moment it's cleared. !important is required specifically to win
		   over that later inline style, which a plain selector can't do. */
		#loading_interface {
			display: none !important;
		}
	</style>
</head>

<body id="browser">
	<!--
		Deliberately nothing visible here: the window just shows its native
		background colour until main.js navigates it to the real app. This
		page still has to exist and run main.js, though -- app.go's
		FrontendReady comment explains why the omnidb-server subprocess can't
		be started until *this* page's JS has registered its "backend:ready"
		listener, so there's no way to skip straight to the real window. A
		branded splash used to render here, but the backend usually reports
		ready before it had time to finish (or even start) its reveal
		animation, so it just added a flash of UI for no benefit. The 3 ids
		below stay (permanently hidden by the CSS rule above) only because
		main.js still does getElementById on all of them and appends backend
		log lines into #loading.
	-->
	<div id="loading_interface" style="display: none;">
		<div id="login_wrap_body">
			<div id="loading"></div>
		</div>
	</div>

	<script src="./src/main.js" type="module"></script>
</body>

</html>
