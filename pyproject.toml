[project]
name = "omnidb"
version = "3.2.1"
description = "Revived open-source database management tool (PostgreSQL-focused, NW.js-based)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "setuptools",
    "Django>=5.2",
    "CherryPy",
    "social-auth-app-django>=5.8.0",
    "django-auth-ldap",
    "pyscrypt",
    "pyaes",
    "openpyxl",
    "sshtunnel",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]",
    "RestrictedPython",
    "cx_Oracle",
    "PyMySQL",
    "sqlparse",
    "pgspecial>=1.11.1",
]
