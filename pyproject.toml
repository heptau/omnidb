[project]
name = "omnidb"
version = "3.2.2"
description = "Revived open-source database management tool (PostgreSQL-focused)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "setuptools",
    "Django>=5.2",
    "CherryPy",
    "social-auth-app-django>=5.8.0",
    "django-auth-ldap; sys_platform != 'win32'",
    "pyscrypt",
    "pyaes",
    "openpyxl",
    "sshtunnel",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]",
    "RestrictedPython",
    "oracledb",
    "PyMySQL",
    "sqlparse",
    "pgspecial>=1.11.1",
]
